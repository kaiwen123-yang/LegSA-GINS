observation_contract:
  data_mode: real_by2_raw
  exact_pairing_key: [gps_week, gps_tow_seconds]
  pairing_tolerance_seconds: 0.0
  required_paired_epoch_count: 1509
  elevation_mask_deg: 10.0
  minimum_cno_dbhz: 20
  phase_value_policy: CPMES_AS_REPORTED_NO_SECOND_HALF_CYCLE_SHIFT
  half_cycle_unknown_policy: EXCLUDE
  receiver_initialization: PINNED_RTKLIB_PNTPOS_RAW_CODE_SPP_ONLY_BY_SYSTEM_MODE
  satellite_states: RTKLIB_180043EE_BROADCAST_TRANSMIT_TIME
  corrections: [EARTH_ROTATION, SAASTAMOINEN_DD_TROPOSPHERE]
  DD_troposphere_relative_humidity: 0.0
  separate_pivot_per_constellation: true
  exact_same_RAWX_signal_identity_required_at_both_receivers: true
  common_satellite_set_across_two_frequencies_per_constellation: true
  cross_system_double_differences: false
  double_difference_sign: "(GNSS2-GNSS1)_SATELLITE_MINUS_PIVOT"
  phase_bias_calibration: NONE
  stochastic_mapping:
    pseudorange_sigma_m: "max(0.50,0.01*2^prStdev)"
    carrier_sigma_cycles: "max(0.004,0.004*cpStdev)"
    undifferenced_receiver_variances_summed: true
    shared_pivot_correlations_preserved: true
    trace_tuned: false

declared_par_policy:
  identity: EXT04_PAR_DECLARED_POLICY_V1
  reproduction_level: PAPER_DERIVED_POLICY_BASELINE
  ordering_worst_to_best:
    - LOWER_MINIMUM_TWO_RECEIVER_CNO
    - LOWER_SATELLITE_ELEVATION
    - LARGER_MARGINAL_FLOAT_AMBIGUITY_VARIANCE
    - LARGER_ABSOLUTE_NORMALIZED_PHASE_RESIDUAL
    - CONSTELLATION
    - SATELLITE_ID
    - SIGNAL_ID
  removal: ONE_AT_A_TIME_REBUILD_FLOAT_SUBSET_AND_STRICT_SEARCH
  re_rank_after_each_rebuilt_float_subset: true
  preserve:
    minimum_nonpivot_DD_ambiguities: 3
    baseline_geometry_rank: 3
    minimum_valid_frequency_blocks: 1
    separate_constellation_pivots: true
  primary_gates:
    objective_equivalence:
      recorded_orientations: [second_over_best, best_over_second]
      acceptance_convention: SECOND_OVER_BEST_GE_THRESHOLD
      threshold: 3.0
      source: PAPER_EXPERIMENTAL_VALUE
      prompt_literal_conflict: BEST_OVER_SECOND_GE_3_IS_IMPOSSIBLE_FOR_MINIMIZED_ORDERED_OBJECTIVES
    baseline_validation:
      source_baseline: UNCONSTRAINED_CONDITIONAL_FIXED_BASELINE
      residual: "norm(b_conditional_unconstrained)-0.350"
      absolute_tolerance_m: 0.050
      source: PAPER_BASELINE_PARAMETER_TRANSPARENTLY_REPURPOSED_AS_DECLARED_TOLERANCE
    posterior_residual:
      residual: COMPLETE_POSTFIT_DD_CODE_AND_PHASE
      degrees_of_freedom: OBSERVATION_COUNT_MINUS_TWO_SPHERE_BASELINE_DOF
      chi_square_upper_tail_alpha: 0.01
      source: DECLARED_STATISTICAL_POLICY_NOT_PAPER_DISCLOSED
    ADOP:
      formula: "exp(logdet(Q_NhatNhat)/(2*m))"
      threshold_cycles: 0.12
      source: DECLARED_STANDARD_GNSS_POLICY_NOT_PAPER_DISCLOSED
  sensitivity_one_at_a_time_no_selection:
    - {identity: EXT04_PAR_DECLARED_POLICY_V1_RATIO_2P0, parameter: ratio, value: 2.0}
    - {identity: EXT04_PAR_DECLARED_POLICY_V1_RATIO_5P0, parameter: ratio, value: 5.0}
    - {identity: EXT04_PAR_DECLARED_POLICY_V1_BASELINE_0P020M, parameter: baseline_tolerance_m, value: 0.020}
    - {identity: EXT04_PAR_DECLARED_POLICY_V1_BASELINE_0P100M, parameter: baseline_tolerance_m, value: 0.100}
    - {identity: EXT04_PAR_DECLARED_POLICY_V1_POSTERIOR_ALPHA_0P001, parameter: posterior_alpha, value: 0.001}
    - {identity: EXT04_PAR_DECLARED_POLICY_V1_ADOP_0P10, parameter: ADOP_cycles, value: 0.10}
    - {identity: EXT04_PAR_DECLARED_POLICY_V1_ADOP_0P15, parameter: ADOP_cycles, value: 0.15}

