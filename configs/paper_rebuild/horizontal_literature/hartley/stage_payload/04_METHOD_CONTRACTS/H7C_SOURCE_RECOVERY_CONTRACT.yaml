frozen_hypotheses:
  H1:
    statement: >-
      trace_vrtk2 is a derived/exported view of user_io-out-poi_geodetic
    initial_state: UNPROVEN
  H2:
    statement: reference physical point is FP_POI
    initial_state: UNPROVEN
  H3:
    statement: YPR represents ENU0-to-FP_POI orientation
    initial_state: UNPROVEN
  H4:
    statement: >-
      user_io-out-poi_odometry provides full ECEF-to-FP_POI quaternion,
      position, velocity, and angular velocity
    initial_state: UNPROVEN
  H5:
    statement: >-
      the only unresolved comparison transform is
      T_FP_POI_from_GO2_BODY_IMU
    initial_state: UNPROVEN
    availability_assumed: false
    conclusion_frozen_as_available: false

proof_classifications:
  allowed:
    - SOURCE_EXPLICIT
    - DETERMINISTIC_FIELD_MAPPING
    - NUMERICAL_IDENTITY_CROSSCHECK
    - UNPROVEN
    - CONTRADICTED
  numerical_identity_rule: >-
    NUMERICAL_IDENTITY_CROSSCHECK may support lineage only after the source
    field mapping is fixed; it may not choose a frame convention.

transform_notation:
  canonical: T_A_from_B
  meaning: >-
    T_A_from_B maps coordinates of a point expressed in frame B into frame A;
    p_A = R_A_from_B * p_B + t_A_from_B.
  required_comparison_transform: T_FP_POI_from_GO2_BODY_IMU
  fixposition_output_transform_boundary: >-
    Official FP_A-TF_POIVRTK semantics may close T_VRTK_from_POI or its exact
    inverse depending on source convention; it does not by itself close the
    Go2 mounting transform.

