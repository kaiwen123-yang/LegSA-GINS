  "Eq.(7)": BASELINE_LENGTH_PSEUDO_OBSERVATION
  "Eqs.(8)-(9)": AUGMENTED_OBSERVATION_AND_DESIGN

algorithm:
  baseline_length_m: 0.350
  baseline_receiver_order: GNSS2_MINUS_GNSS1
  frame: NED
  ratio_definition: SUBOPTIMAL_ILS_RESIDUAL_DIVIDED_BY_OPTIMAL_ILS_RESIDUAL
  ratio_threshold: 3.0
  ambiguity_solver: MLAMBDA_REDUCTION_AND_TWO_CANDIDATE_SEARCH
  initial_baseline_covariance_m2: 900.0
  initial_ambiguity_covariance_cycle2: 900.0
  primary_baseline_sigma_m: 0.010
  sensitivity_baseline_sigmas_m: [0.001, 0.005, 0.010, 0.020, 0.050]
  constraint_linearization_priority:
    - PREVIOUS_SUCCESSFULLY_RATIO_FIXED_BASELINE
    - RAW_PSEUDORANGE_SPP_BASELINE_DIFFERENCE
    - CURRENT_FINITE_FLOAT_BASELINE
    - NO_VALID_CONSTRAINT_LINEARIZATION_POINT
  dynamic_ambiguity_policy:
    new_variance_cycle2: 900.0
    vanished: REMOVE_WITH_COVARIANCE_REINDEX
    affected_slip: RESET_ONLY_AFFECTED_STATE
    pivot_change: EXACT_DD_BASIS_TRANSFORM_OR_REINITIALIZE_WITH_RECORDED_REASON
    covariance: SYMMETRIC_POSITIVE_SEMIDEFINITE

system_modes:
  GPS_DUAL_FREQUENCY:
    constellations: [GPS]
    frequency_groups: [GPS_L1, GPS_L2]
    pivot_count: 1
  BDS_DUAL_FREQUENCY:
    constellations: [BDS]
    frequency_groups: [BDS_B1, BDS_B2]
    pivot_count: 1
  GPS_BDS_DUAL_FREQUENCY:
    constellations: [GPS, BDS]
    frequency_groups: [GPS_L1, GPS_L2, BDS_B1, BDS_B2]
    pivot_count: 2
    cross_system_double_differences: false
    constellation_blocks_separate: true

signal_registry:
  GPS_L1:
    ublox_identities: [[0, 0, 0]]
    rinex_rtklib: [1C]
    frequency_hz: 1575420000.0
  GPS_L2:
    ublox_identities: [[0, 3, 0], [0, 4, 0]]
    rinex_rtklib: [2L, 2S_UNUSABLE_ON_BY2]
    frequency_hz: 1227600000.0
  BDS_B1:
    ublox_identities: [[3, 0, 0], [3, 1, 0]]
    rinex_rtklib: [2I]
    frequency_hz: 1561098000.0
  BDS_B2:
    ublox_identities: [[3, 2, 0], [3, 3, 0]]
    rinex_rtklib: [7I]
    frequency_hz: 1207140000.0
  excluded_constellations: [GLONASS, Galileo, QZSS, SBAS]

requested_variants:
  - {system_mode: GPS_DUAL_FREQUENCY, constraint_mode: UNCONSTRAINED, baseline_sigma_m: null}
  - {system_mode: GPS_DUAL_FREQUENCY, constraint_mode: CONSTRAINED, baseline_sigma_m: 0.010}
  - {system_mode: BDS_DUAL_FREQUENCY, constraint_mode: UNCONSTRAINED, baseline_sigma_m: null}
  - {system_mode: BDS_DUAL_FREQUENCY, constraint_mode: CONSTRAINED, baseline_sigma_m: 0.010}
  - {system_mode: GPS_BDS_DUAL_FREQUENCY, constraint_mode: UNCONSTRAINED, baseline_sigma_m: null}
  - {system_mode: GPS_BDS_DUAL_FREQUENCY, constraint_mode: CONSTRAINED, baseline_sigma_m: 0.001}
  - {system_mode: GPS_BDS_DUAL_FREQUENCY, constraint_mode: CONSTRAINED, baseline_sigma_m: 0.005}
  - {system_mode: GPS_BDS_DUAL_FREQUENCY, constraint_mode: CONSTRAINED, baseline_sigma_m: 0.010}
  - {system_mode: GPS_BDS_DUAL_FREQUENCY, constraint_mode: CONSTRAINED, baseline_sigma_m: 0.020}
  - {system_mode: GPS_BDS_DUAL_FREQUENCY, constraint_mode: CONSTRAINED, baseline_sigma_m: 0.050}

observation_contract:
  data_mode: real_by2_raw
  exact_pairing_key: [gps_week, gps_tow_seconds]
  pairing_tolerance_seconds: 0.0
  required_paired_epoch_count: 1509
  real_rate_hz: 5.0
  elevation_mask_deg: 15.0
  elevation_mask_source: RTKLIB_180043EE_PRCOPT_DEFAULT_ELMIN
  separate_pivot_per_constellation: true
  cross_system_double_differences: false
  combined_system_bias_handling:
    production_DD_blocks: SEPARATE_WITHIN_GPS_AND_WITHIN_BDS
    explicit_relative_hardware_bias_state: false
    GPS_measurement_factor: 1.0
    BDS_measurement_factor: 1.0
    per_receiver_pntpos_clock_model: GPS_CLOCK_PLUS_BDS_MINUS_GPS_OFFSET
    pntpos_clock_or_ISB_transferred_to_DD: false
  double_difference_sign: "(GNSS2-GNSS1)_SATELLITE_MINUS_PIVOT"
  covariance_policy: FULL_SHARED_PIVOT_CORRELATION
  receiver_initialization: PINNED_RTKLIB_PNTPOS_RAW_CODE_SPP_ONLY
  receiver_initialization_options:
    mode: PMODE_SINGLE
    navsys_by_mode: {GPS_DUAL_FREQUENCY: 1, BDS_DUAL_FREQUENCY: 32, GPS_BDS_DUAL_FREQUENCY: 33}
    sateph: EPHOPT_BRDC
    ionoopt: IONOOPT_BRDC
    tropopt: TROPOPT_SAAS
    pntpos_relative_humidity: 0.7
    combined_clock_model: GPS_CLOCK_PLUS_BDS_MINUS_GPS_OFFSET
  satellite_states: RTKLIB_180043EE_BROADCAST_TRANSMIT_TIME
  corrections: [SATELLITE_CLOCK, EARTH_ROTATION, BROADCAST_IONOSPHERE_IN_PNTPOS, SAASTAMOINEN_TROPOSPHERE]
  DD_troposphere:
    implementation: RTKLIB_ZDRES_HYDROSTATIC_SAASTAMOINEN_EQUIVALENT
    relative_humidity: 0.0
  phase_value_policy: CPMES_AS_REPORTED_NO_SECOND_HALF_CYCLE_SHIFT
  phase_bias_calibration: NONE

cycle_slip_chain:
  detectors: [LLI_RECEIVER_TRACKING_STATE, GEOMETRY_FREE, MELBOURNE_WUBBENA, PRIOR_DD_AMBIGUITY_CONSISTENCY]
  receiver_event_categories:
    actual_carrier_lli_or_validity_transition: ACTUAL_CARRIER_LLI_OR_TRACKING_VALIDITY_DISCONTINUITY
    locktime_decrease: RECEIVER_LOCKTIME_RESET
    halfCyc_or_subHalfCyc_transition: HALF_CYCLE_VALIDITY_OR_SUBHALFCYC_CHANGE
    receiver_clock_reset: RECEIVER_CLOCK_RESET_EVENT
  receiver_clock_reset_labeled_as_cycle_slip: false
  receiver_event_counter_semantics: UNIQUE_AFFECTED_SIGNAL_IDENTITIES_RECEIVER_DIMENSION_DEDUPLICATED
  threshold_source: RTKLIB_180043EE_DEFAULTS_OR_PREREGISTERED_PHYSICAL_VALUE
  method_initialization_is_receiver_cycle_slip: false
  method_initialization_is_lock_reset: false
  half_cycle_change_is_ordinary_method_initialization: false
  prior_DD_semantics: ONE_EPOCH_LAGGED_CHANGE_IN_PRIOR_KF_ESTIMATED_DD_AMBIGUITY_CYCLES
  prior_DD_pivot_change_policy: EXACT_TARGET_BASIS_TRANSFORM_OR_PRIOR_DD_UNAVAILABLE_PIVOT_CHANGE_REINITIALIZED

stochastic_instantiation:
  paper_disclosed: [initial_baseline_covariance_m2, initial_ambiguity_covariance_cycle2, ratio_threshold, signal_systems_and_frequencies, baseline_length_m]
  paper_unspecified: [measurement_noise_matrix, process_noise_matrix, baseline_pseudo_observation_variance]
  unspecified_source: PINNED_RTKLIB_180043EE_DEFAULTS_EXCEPT_PREREGISTERED_BASELINE_SIGMA
  trace_tuned: false
  rtklib_measurement_defaults:
    symbols: ["prcopt_default.err[1]", "prcopt_default.err[2]", "prcopt_default.eratio[0]", varerr]
    phase_constant_m: 0.003
    phase_elevation_m: 0.003
    code_phase_ratio: 100.0
    GPS_error_factor: 1.0
    BDS_error_factor: 1.0
    baseline_length_term_at_0p350m: 0.0
    receiver_clock_stability_term_at_dt0: 0.0
    single_difference_variance: "2*((fact*0.003)^2+(fact*0.003)^2/sin(elevation)^2)"
    code_variance_multiplier: 10000.0
    double_difference_covariance: SHARED_PIVOT_DDCOV
    UBX_stdev_model_used: false

