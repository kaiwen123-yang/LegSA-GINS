effect_validation_contract:
  affected_sources_only: true
  seeded_epoch_count_or_mask_matches_spec: true
  configured_value_or_std_change_matches_spec: true
  seed_replay_is_identical: true
  timestamps_monotonic_or_jitter_bounded: true
  no_unexpected_nan_or_inf: true
  yaw_changes_wrap_safe: true
  baseline_length_remains_physically_auditable: true
  trace_for_generation_or_tuning: false
  final_v23_or_legsa_output_for_generation_or_tuning: false
