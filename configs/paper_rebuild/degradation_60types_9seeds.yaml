clean_case:
  case_id: BY2_CLEAN_CANONICAL
  case_index: 0
  family: clean
  degradation_type_id: CLEAN
  degradation_type_name: clean_reference_no_degradation
  seed_index: none
  seed_value: null
  rng_algorithm: none
  anchor_name: none
  duration: full_sequence
  parameters: {operation: none}
  requires_provider_generation: false
  trace_evaluation_only: true

case_rules:
  case_id_template: "BY2_{degradation_type_id}_{degradation_type_name}_{seed_index}"
  case_index_order: clean_then_D01_to_D60_each_seed_00_to_seed_08
  rng_algorithm: numpy.random.PCG64
  same_seed_fairness: true
  trace_evaluation_only: true
  trace_used_for_anchor_or_parameter_selection: false
  final_v23_or_legsa_output_used_for_generation: false
  raw_data_overwritten: false
  provider_lineage_required: true
  input_and_output_sha256_required: true
  effect_rule_id_template: "RULE_{degradation_type_id}"
  mixed_component_validation: each_component_independently_validated
  source_family_separation:
    raw_doppler_and_receiver_velocity_are_distinct: true
    go2_inputs_are_weak_prior_or_diagnostic_only: true

