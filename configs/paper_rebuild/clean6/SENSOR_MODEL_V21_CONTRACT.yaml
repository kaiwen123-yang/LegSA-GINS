resolved_conflicts:
- id: B01
  status: RESOLVED_BY_HUMAN
  requirement: Freeze executable 9c00565c while setting formal F02 std to 2.933193 degrees.
  evidence: cpp/legsa_v23_port_core/src/config/port_config_loader.cpp:372-373
  conflict: The frozen scientific loader rejects basic_dual_yaw_EKF unless its fixed yaw std is 1.5 within 1e-12,
    with error 'basic_dual_yaw_EKF fixed yaw std must be 1.5 deg'. The frozen executable contains this guard.
  forbidden_workarounds:
  - bypass_guard
  - change_algorithm_identity
  - patch_binary
  - silently_keep_F02_at_1_5
  - silently_omit_F02
  adopted_resolution: Accept only existing 1.5 and preregistered 2.933193 in the F02 fixed-std guard; no other native
    source change. Preserve old executable. Freeze new SHA. Under std=1.5 compare C00 x 11 new/old NAV and STD bytes;
    require PASS before v2.1. 2.933193 is below scheme-C soft threshold 3.0 degrees; thresholds unchanged.
- id: B02
  status: RESOLVED_BY_HUMAN
  requirement: Final scaled HV provider residuals reproduce unscaled P-11b H-A to 1e-6.
  conflict: Multiplying by k_HV changes residuals; the final residual cannot generally equal the unscaled residual.
  adopted_resolution: Inverse-scale new HV by dividing by k_HV, reproduce P-11b H-A residual statistics at absolute
    tolerance 1e-6. Report final scaled residuals separately.
- id: B03
  status: RESOLVED_BY_HUMAN
  requirement: Change GNSS yaw_std column while preserving the GNSS full-file hash.
  conflict: Changing zero-based column 14 in a 15/18-column file changes its full-file bytes and SHA-256.
  adopted_resolution: Original source hashes unchanged. New GNSS15/18 has token equality outside zero-based column14;
    every yaw_std token is 2.933193 before applying frozen fault transformations. After injection, retain all frozen
    fault effects except the preregistered nominal yaw_std is 2.933193; compare each case with the equivalent old
    injected table outside column14.
- id: B04
  status: RESOLVED_BY_HUMAN
  requirement: frozen_parameter_hash differs in exactly three fields.
  conflict: The existing hash covers runtime scientific configuration only. status_fixed_yaw_std_deg is a provider-generator
    field, HV std lives in CSV, and RP sign/velocity frame/scale are provider transformations. Of the named scalar
    runtime fields only basic_dual_yaw_fixed_std_deg changes.
  adopted_resolution: Keep frozen_parameter_hash definition. Independently hash a SENSOR_MODEL_V21 group containing
    HV, RP and sigma_A1 corrections. Report all actual runtime-key and provider-token differences.
- id: B05
  status: RESOLVED_BY_HUMAN
  requirement: Regenerate A1/D61 yaw-outage bundles while HV now depends on A1 yaw.
  conflict: Building HV from clean yaw before the outage would retain otherwise unavailable heading information
    in the weak prior. The original addendum preserves Go2 validity, while the new A1 gap rule changes derived HV
    validity.
  adopted_resolution: Apply frozen A1 injections first; derive HV using injected valid A1. A1 gaps >1.2s invalidate
    HV in their open interval, including all-HV-invalid for fully absent A1. Retain Go2 source validity separately
    and apply the frozen direct RP/HV perturbations to the corrected source values.
