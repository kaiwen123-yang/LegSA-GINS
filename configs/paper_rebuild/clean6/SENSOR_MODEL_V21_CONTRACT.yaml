hypotheses:
  report_all: true
  decision_definitions_state: FROZEN_BEFORE_PROVIDER
  decision_rule_and_Outcome_changed: false
  no_posthoc_definition_selection: true
  H7:
    text: Heading consistency ratio decreases to 1-2.
    definition: Frozen evaluator yaw_abs_error_over_std_median (median absolute wrap-safe yaw error divided by matched
      yaw STD). Per profile/clean sequence report old/new ratio; supported if new in [1,2] and lower than old; missing=INCOMPLETE.
  H8:
    text: Clean-sequence downweight/reject counts decrease; report change in matrix ALL_YAW_REJECTED failure counts.
    definition: Per profile/clean sequence report yaw_DOWNWEIGHT and yaw_REJECT separately and their sum; decrease
      predicate is new sum < old sum; zero-to-zero UNCHANGED. Matrix failures reported by family/profile without
      directional hypothesis.
  H9:
    text: A2 outage-end horizontal error is less than 10 m for the 20 s outage.
    threshold_m: 10.0
    strict_less_than: true
    metric_definition: Inherit addendum outage_end_horizontal_error_m from the last matched epoch in the half-open
      outage interval.
    definition: Per profile and every A2 20s seed test outage_end_horizontal_error_m <10; per-profile all/some/none
      -> SUPPORTED/PARTIALLY_SUPPORTED/NOT_SUPPORTED; any missing -> INCOMPLETE with available components retained.
  H10:
    text: C00 and three-sequence roll/pitch RMSE decrease.
    definition: 'Each profile/sequence/C00 and each roll/pitch RMSE: supported iff new < old, unchanged if equal;
      no pooled replacement. A joint label requires all applicable components and full coverage.'
  H11:
    text: Report yaw RMSE changes without prespecifying their direction.
    direction: NOT_PRESET
    definition: Report signed new-minus-old yaw RMSE for all cells without a directional hypothesis; REPORTED_NON_DIRECTIONAL
      with complete coverage, otherwise INCOMPLETE.
  coverage: All ten profiles, all requested sequences/cases, v3 primary and v2 parallel; each applicable component
    reported separately. No new method selection/Outcome.
