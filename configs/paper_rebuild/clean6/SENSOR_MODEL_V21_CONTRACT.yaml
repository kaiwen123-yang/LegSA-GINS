sensor_model_requested:
  calibration_policy:
    dataset: BY2
    calibration_count: 1
    blind_transfer:
    - BY2H
    - BY2O
    refit_allowed: false
    note: Apply the human-specified rounded numerical constants exactly. Other sequences provide reported checks
      only; no per-sequence or per-case tuning.
  go2_hv: &id002
    source: Raw Go2 body-frame FLU velocity, Go2 roll/pitch, and observation A1 NED body yaw.
    flu_to_frd: diag(1,-1,-1)
    formula: v_H_NED = horizontal(k_HV * Rz(A1_NED) * Ry(-Go2_pitch) * Rx(Go2_roll) * diag(1,-1,-1) * v_body_FLU)
    k_HV_expression: 1 / 0.962142
    k_HV_denominator: 0.962142
    sigma_HV_mps: 0.132838
    a1_interpolation: Unwrap shortest angular steps and linearly interpolate in time; no extrapolation; invalidate
      the open interval of a gap greater than 1.2 s, retaining observed endpoints, as in P-11b.
    maximum_a1_gap_s: 1.2
    go2_yaw_used_for_HV: false
    installation_angle_fit: false
    invalid_row_policy: Use the supported explicit provider validity field; do not synthesize zero measurements,
      NaN observations or enormous standard deviations as updates.
    noise_limitation: 0.132838 is the rounded BY2 unscaled H-A residual proxy, including PVT, A1, timing and weak-prior
      errors; it is not independently identified white sensor noise. Final scaled residuals require separate reporting
      (B02).
  go2_rp: &id003
    formula:
    - Go2_roll
    - -Go2_pitch
    input_frame: FLU
    output_frame: FRD
    std_deg: 1.6
    std_changed: false
    frozen_static_pitch_residual_means_deg:
    - 2.028821
    - 2.212328
    - -4.296193
    corrected_static_pitch_residual_means_deg:
    - -0.444112
    - -0.420844
    - -0.412029
    sequence_order:
    - BY2
    - BY2H
    - BY2O
    evidence_role: P-12 observation-only frame check, not independent attitude truth.
  dual_yaw: &id004
    old_std_deg: 1.5
    status_fixed_yaw_std_deg: 2.933193
    basic_dual_yaw_fixed_std_deg: 2.933193
    gnss_yaw_std_zero_based_column: 14
    gnss_formats_columns:
    - 15
    - 18
    scheme_C_thresholds_changed: false
    evidence: 'BY2 Euler yaw-rate increment-residual proxy 2.933193 degrees; BY2O 2.936449 degrees as a check, BY2H
      8.406459 degrees reported without refit. Human supplied physical scale: 0.35 m baseline, approximately 2.5-3
      degrees.'
