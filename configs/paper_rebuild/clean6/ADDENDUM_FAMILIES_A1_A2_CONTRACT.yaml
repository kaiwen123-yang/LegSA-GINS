  F01: single_antenna_EKF
  F02: basic_dual_yaw_EKF
  F03: AB0000
  F04: AB1111
  A03: AB0111
  A04: AB1011
  A05: AB1101
  A06: AB1110
  A07: AB1100
  A08: AB1000
  A09: AB0100
field_definitions:
  fault_window_horizontal_rmse_m: P-09c existing definition over the registered half-open outage interval; retain
    frozen summary value.
  post_window_horizontal_rmse_m: P-09c frozen definition t > outage_end_s, through full-window end, unchanged.
  outage_end_horizontal_error_m: horizontal_err_m from full-rate sealed error_series at the last matched evaluation
    epoch t with outage_start_s <= t < outage_end_s; no interpolation to endpoint; unavailable if no matched epoch
    or that last epoch is nonfinite. Record selected time and full-rate source sha256.
  max_horizontal_error_in_window_m: Maximum horizontal_err_m over all matched evaluation epochs t with outage_start_s
    <= t < outage_end_s in full-rate sealed error_series; unavailable if no epochs or any in-window value nonfinite;
    not maximum of the 10 Hz display sample.
hypotheses:
  H1:
    text: In A1 the HV configurations A04/F04/A03/A05 have lower fault-window horizontal RMSE and outage-end horizontal
      error than F03/A06/A07/A08/A09, with the gap growing with duration.
    HV:
    - A04
    - F04
    - A03
    - A05
    no_HV:
    - F03
    - A06
    - A07
    - A08
    - A09
    report: All 20 cross-group paired comparisons, both metrics, all seeds, family and duration medians. Report
      full_vs_no_HV as the isolated HV contrast.
    decision: For each of 20 contrasts and each metric, benefit requires negative family median; duration trend
      requires median delta(30s)<median delta(20s)<median delta(10s). SUPPORTED if every benefit and trend holds;
      PARTIALLY_SUPPORTED if some but not all hold; NOT_SUPPORTED if none hold; INCOMPLETE if required finite pairs
      unavailable. Report component decisions and failure counts.
  H2:
    text: HV benefit in A2 with retained heading is greater than in A1.
    contrast: full_vs_no_HV, and all 20 HV/no-HV contrasts as secondary; A2 delta minus A1 delta matched on same
      duration and seed, only common 10/20s (n=18).
    decision: Negative median difference for each primary metric = SUPPORTED; mixed signs = PARTIALLY_SUPPORTED;
      no negative median = NOT_SUPPORTED; missing paired evidence = INCOMPLETE. Also report per-duration n=9.
  H3:
    text: With heading absent in A1, body priors may harm some seeds, as already observed in D06.
    contrast: full_vs_no_Go2, full_vs_no_RP, full_vs_no_HV and A04_vs_F03; report both primary metrics and every
      duration/seed sign.
    decision: At least one positive finite full_vs_no_Go2 primary-metric delta = OBSERVED_SOME_SEED_HARM; none =
      NOT_OBSERVED; missing evidence disclosed separately. No post-hoc removal of harmful seeds.
