  orientation:
    matrix: C_b_n = Rz(yaw_NED) * Ry(pitch) * Rx(roll)
    matrix_source: cpp/legsa_v23_port_core/src/common/rotation.cpp:131-140
    roll_pitch: Raw Go2 imu_state.rpy[0:2] in radians, linearly interpolated at each IMU timestamp; exactly the existing weak-prior operation, no added sign/installation adjustment.
    roll_pitch_source: src/legsa_gins/paper_rebuild/providers.py:203-215
    attitude_frame_claim: Frozen operational convention; no extra claim of independently verified physical FRD attitude calibration.
    yaw: Frozen A1 body_yaw_ned_deg; source_timestamp joined to status header in integer milliseconds, then status time_gps_tow to iTOW; cross-check frozen V2 yaw-valid tokens.
    yaw_interpolation: Unwrap shortest angular steps and linearly interpolate; no extrapolation.
    maximum_a1_gap_seconds: 1.2
    unsupported_pair_policy: Skip the whole pair if its interval crosses a longer A1 gap or lacks orientation support; record reason and count.
  integration:
    formula: residual_NED = sum(C_b_n(t_i) * dvel_i for t < t_i <= t+lag) + [0,0,g_local]*lag - (PVT_velocity(t+lag)-PVT_velocity(t))
    dvel_semantics: Frozen V2s dvel already equals installed FRD specific force times s and measured dt; do not multiply by s or dt again.
    imu_builder_source: src/legsa_gins/input_generation/imu_txt_builder.py:95-135
    scale_builder_source: src/legsa_gins/paper_rebuild/clean5_imu_parity/providers.py:50-57
    integration_convention: Frozen current sample (right endpoint), not external previous-sample ZOH.
    coriolis_included: false
    transport_rate_included: false
    existing_imu_gaps: Preserve existing provider rows; report coverage/time differences and gaps without residual-based exclusion or reweighting.
  fit:
    lag_milliseconds: [200, 400, 600, 800, 1000, 1500, 2000]
    pair_policy: Every exact integer-iTOW endpoint pair wholly inside [66,340]; overlapping pairs retained; no PVT interpolation or nearest-neighbour substitution.
    missing_lag_policy: Report all seven lags; zero pairs is UNAVAILABLE and excluded from OLS. In particular 1.5 s cannot pair on a strict same-phase 5 Hz grid.
    residual_variance_ddof: 1
    minimum_samples_per_variance: 2
    regression: Unweighted ordinary least squares with intercept, var_r(lag)=q*lag+c, independently on N/E/D, using all available finite lag variances.
    minimum_available_lags: 2
    vrw_formula: sqrt(q)*60
    vrw_units: (m/s)/sqrt(h)
    q_units: m^2/s^3
    c_units: (m/s)^2
    c_policy: GNSS velocity-noise diagnostic only; retain signed intercept without clipping or feedback.
    residual_clipping: false
    robust_regression: false
    selection_by_trace_or_performance: false
  bias_windows:
    lag_seconds: 1.0
    full_windows_seconds: [[66.0,126.0], [126.0,186.0], [186.0,246.0], [246.0,306.0]]
    pair_membership: Pair start >= window start and pair end <= window end; no pair repeated between windows.
    window_statistic: Mean of residual/1.0 second per axis over every supported pair.
    across_window_std_ddof: 1
    abstd_formula: std(window_mean_residual_acceleration)*100000
    abstd_units: mGal
    trailing_interval_seconds: [306.0, 340.0]
    trailing_interval_policy: Report-only incomplete 34 s window, excluded from abstd by preregistration.
  fallback:
    per_axis: If q <= 0 or fewer than 3 nonempty full windows, use both frozen vrw and frozen abstd for that axis and mark FALLBACK.
