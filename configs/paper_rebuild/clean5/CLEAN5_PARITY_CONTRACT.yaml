variants:
- id: V0
  status: FROZEN_REFERENCE_ONLY
  provider_family: null
  definition: Reuse sealed Canonical BY2 C00 A04/F01/F03 result references; no rerun or provider mutation.
  hypothesis: Reference for attribution; no new performance hypothesis.
  expected_direction: Not applicable
- id: V1
  status: PRE_REGISTERED_NOT_EXECUTED
  provider_family: CLEAN5_PARITY_V1
  definition: 1 Hz gnss1-status; substitute corresponding header epoch for sys_stamp in GNSS time column only.
  byte_contract: All non-time tokens/bytes and row identities in V0 GNSS remain equal; IMU, RD, RP, HV payloads
    equal V0 byte-for-byte. Do not reselect RV/yaw/std for the shifted row.
  row_map_gate: Unique raw gnss1-status row lineage for each frozen GNSS row, with no row loss, reorder or duplicate;
    unavailable map blocks generation.
  hypothesis: Reception latency contributes to along-track discrepancy.
  expected_direction: Smaller forward signed-bias magnitude / position RMSE if timing is a contributor; yaw effect
    not assumed.
- id: V2
  status: PRE_REGISTERED_CONDITIONAL_STD_SEMANTICS_UNAVAILABLE
  provider_family: CLEAN5_PARITY_V2
  position: GNSS1 UBX-NAV-HPPOSECEF, 5 Hz native iTOW, physical GNSS1 antenna point.
  time: GPS epoch + locked GPS week*604800 + iTOW/1000 - locked leap seconds - base_time. Use message week/TIM-TP/raw
    source, never trace or fitted offset.
  std_requested_by_human: pAcc/vAcc as std
  position_std_source: HPPOSECEF pAcc * 1e-4 m; isotropic ECEF pAcc^2 I3 maps to isotropic NED. This is declared
    covariance instantiation, not calibrated uncertainty.
  vAcc_semantics: 'UNAVAILABLE as speed std: HPPOSECEF has no vAcc; NAV-PVT vAcc is vertical position accuracy,
    while sAcc is speed accuracy. No silent substitution of vAcc with sAcc, constant RV std or trace-derived uncertainty.'
  std_gate: Before any V2 provider or solve, close and commit a source-backed interpretation of requested vAcc (position
    vertical or speed accuracy). Until then V2 is not executable.
  RV: Nearest NAV-PVT by iTOW-derived measurement UTC with |dt| <= 0.1 s; tie -> earlier measurement epoch; no interpolation/hold/extrapolation;
    absent -> velocity_valid=0.
  A1: Frozen GNSS2-GNSS1 status physical yaw, same validity/transform/std; match header measurement UTC to nearest
    HP row within 0.1 s, tie -> earlier row; at most one yaw update per A1 epoch and row. No match/collision ->
    blocked mapping, never repeat or delete silently.
  encoding: Use no_update_encoding chosen 18-column existing extension. F01 yaw module remains disabled.
  unchanged: Frozen scientific parameters and IMU/RD/RP/HV payloads; only declared GNSS source/std/epoch and yaw/RV
    association changes.
  hypothesis: Measurement-epoch 5 Hz position can reduce latency/discretization effects; changed observation noise
    and scheduling can alter uncertainty and trajectory.
  expected_direction: Potential smaller position RMSE; no guarantee and no numerical acceptance threshold selected
    from audit.
- id: V3
  status: PRE_REGISTERED_CONDITIONAL_REFERENCE_POINT_UNAVAILABLE
  provider_family: CLEAN5_PARITY_V2 (same solver output)
  definition: V2 output evaluated under separate v3 physical point contract; reference point target is antenna midpoint.
  transform: l_IMU_to_midpoint_FRD = l_IMU_to_GNSS1_FRD + 0.5*b_GNSS2_minus_GNSS1_FRD; p_mid_ECEF = p_IMU_ECEF +
    R_NED_to_ECEF * R_body_to_NED(method_attitude) * l_IMU_to_midpoint_FRD.
  frozen_l_IMU_to_GNSS1_FRD_m:
  - 0.03
  - 0.03
  - -0.3
  frozen_b_GNSS2_minus_GNSS1_FRD_m:
  - 0.0
  - -0.35
  - 0.0
  derived_l_IMU_to_midpoint_FRD_m:
  - 0.03
  - -0.145
  - -0.3
  baseline_policy: Use frozen physical 0.350 m, not B2 residual or fitted lever; B5 measured half-baseline is an
    independent descriptive check only.
  reference_point_identity: UNAVAILABLE until source TF/POI/antenna evidence closes trace-point relationship. B2
    agreement cannot itself establish it.
  gate: B2/B5 source evidence must support this transform and reference point; mismatch/missing evidence blocks
    v3. Never shift trace by its mean discrepancy.
  external_application: Apply identical v3 physical contract to EXT05C frozen IMU output with EXT05C own attitude,
    same evaluator window/columns; no EXT05C solver rerun.
  hypothesis: A physical output/reference point mismatch contributes to body-fixed residual.
  expected_direction: Reduce point-related bias if identity closes; otherwise UNAVAILABLE, not presumed improvement.
- id: V4
  status: OPTIONAL_CONDITION_MET_NOT_EXECUTED
  provider_family: CLEAN5_PARITY_V4
  condition: LC01 is dual receiver; A confirms EXT05A alias and two-receiver update.
  definition: Optional dual-HPPOSECEF common-iTOW midpoint position, p_mid=(p1+p2)/2. Preserve correlation caveat;
    R_mid=(R1+R2+R12+R21)/4; R12 source UNAVAILABLE.
  gate: Separate future selection; before solve, preregister exact midpoint covariance and physically consistent
    measurement lever. A midpoint observation with unchanged GNSS1 lever is invalid. Frozen parameter constraint
    is retained; no automatic lever change.
  hypothesis: Symmetric receiver information changes midpoint position observability and noise.
  expected_direction: Potential smaller antenna asymmetry; correlated errors prevent promised sqrt(2) gain.
decomposition:
  metric_vector:
  - horizontal_rmse_m
  - position_3d_rmse_m
  - up_rmse_m
  - yaw_rmse_deg
  time_term: V0 - V1
  rate_term: V1 - V2
  measurement_point_term: V2 - V3
  estimator_term: V3 - EXT05C(v3)
  positive_sign: For the first three lower-is-better RMSE differences, positive means improvement by next rung;
    estimator term positive means internal method worse than EXT05C.
  interpretation: Descriptive sequential differences, not additive physical squared-error components or causally
    isolated effects. Rate term also changes message/std/scheduling. Estimator term retains RV/RD/RP/HV, initialization/noise/implementation/support
    differences.
  unavailable_propagation: If either endpoint is unexecuted, unavailable or differently supported without explicit
    labelling, difference is UNAVAILABLE; never use nearby/legacy rows.
