definitions:
  D1:
    epoch_set: Every yaw_valid=1 row in the frozen GNSS18 table; retain complete provider set and separately report
      closed evaluation-window counts.
    time_formula: t = 315964800 + 2408*604800 + iTOW_ms/1000 - 18 - base_time
    inversion: Exact integer milliseconds with at most 1 microsecond roundtrip error from frozen floating serialization;
      no fit.
    raw_grid: Exact same-iTOW intersection of both receiver HPPOSECEF streams, 200 ms grid; enumerate all unmatched
      A1 epochs.
    windows_s:
      BY2:
      - 66.0
      - 340.0
      BY2H:
      - 413.0
      - 683.0
      BY2O:
      - 3186.0
      - 3563.0
  D2:
    baseline: GNSS2 HPPOSECEF minus GNSS1 HPPOSECEF at identical iTOW.
    frame: Frozen EXT05 fixed NED frame at the first common GNSS1 HPPOSECEF epoch of the file.
    conversion: Direct calls to unchanged status_yaw_builder.build_a1_dual_diff_yaw_rows and apply_yaw_install_and_ned;
      no independently written atan2/offset/wrap formula.
    adapter: Exact common-epoch raw NED positions serialized as status-shaped observation fields for the frozen
      function; format conversion only, no interpolation between unequal raw epochs.
    sign: 1.0
    install_offset_deg: 0.0
    fixed_validity: Both raw NAV-PVT carrSoln equal 2.
    float_validity: For BY2O F variants only, each receiver carrSoln belongs to [1, 2].
    yaw_std_deg: 2.933193
  D3:
    R1: E_seq intersect both receivers carrSoln fixed; preserve complete provider rows and separately report evaluation-window
      counts.
    R5: Every frozen-table row with valid D2 fixed-only raw yaw has yaw_valid=1.
    R1F: 'BY2O: all frozen E_seq epochs including float, exact frozen valid token pattern; std 2.933193.'
    R5F: BY2O only; R5 epoch selection with float_validity.
    allowed_changed_zero_based_columns:
    - 13
    - 14
    - 17
    hard_byte_gate: Every other token, row order, header and whitespace byte unchanged.
    unavailable_raw_yaw: Count and enumerate missing or invalid raw epochs; never substitute A1 or other outputs.
    R1_subset_gate: Candidate valid set is subset of E_seq and excluded set equals exactly E_seq epochs where both
      receiver carrSoln fixed is false; no other differences.
    R1F_exact_valid_mask_gate: Every valid token equals the frozen token, throughout the complete provider table.
    difference_reporting: For all sequences enumerate each excluded E epoch with iTOW, relative time, receiver2
      carrSoln, primary/secondary/outside classification and frozen A1 yaw token; differences on BY2/H also continue
      when the exact subset gate passes.
    revision_observations:
      sequence: BY2O
      A1_valid_raw_GNSS1_fixed_GNSS2_float_epochs: 58
      time_ranges_s_inclusive_step_1:
      - - 3370
        - 3412
      - - 3495
        - 3509
      itow_ranges_ms_inclusive_step_1000:
      - - 460588000
        - 460630000
      - - 460713000
        - 460727000
      full_provider_A1_counts:
        BY2: 301
        BY2H: 295
        BY2O: 445
      evaluation_window_A1_counts:
        BY2: 275
        BY2H: 271
        BY2O: 378
      native_invocations: 0
      evaluator_invocations: 0
      raw_hash_lock_verified: true
      gnss1_raw_sha256: 6035d50419eaa0ff29d9a4b053dbed5d715fd2bec38f44ad4b4be02ca54a4ba9
      gnss2_raw_sha256: 4f18ec7d618c675238d5c40a868ba01802a9d2da9325877d715f75f2f939119f
      expected_BY2O_window_valid_counts:
        R1: 320
        R1F: 378
    revision_authority: Human D3/D4 revision in this conversation, before preregistration and execution.
  D4:
    delta: wrap(yaw_raw - yaw_A1) into [-180, 180) on E_seq.
    statistics: Count, signed mean, population standard deviation, absolute P95, signed P95 and full signed histogram;
      no directional criterion.
    histogram_edges_deg:
    - -180
    - -90
    - -45
    - -20
    - -10
    - -5
    - -2
    - -1
    - 0
    - 1
    - 2
    - 5
    - 10
    - 20
    - 45
    - 90
    - 180
    scopes: Full provider and closed evaluation window; BY2O additionally primary, secondary, inside union and outside.
    occlusion_windows_closed_s:
      primary:
      - 3369.94
      - 3411.95
      secondary:
      - 3495.94
      - 3508.94
    acceleration: Current frozen installed/debiased IMU dv/measured_dt plus body-frame gravity from frozen RP phi=roll_rad+1deg,
      theta=pitch_rad (P-12 installed-frame convention); norm of f_body + R(phi,theta,0)^T*[0,0,g]. RP-supported
      diagnostic, not acceleration truth.
    acceleration_bins_mps2:
    - '[0,0.3)'
    - '[0.3,1]'
    - (1,infinity)
    status_timing: GNSS2-minus-GNSS1 header-stamp differences at matching GPS week/tow identities; report GPS time
      and sys-stamp differences separately and enumerate unmatched identities; no fitted offset. Report actual GNSS2
      header interpolation brackets at GNSS1 header, offsets and weights. Also report nearest GNSS2 header minus
      GNSS1 header/sys/GPS time with explicit selected identities and same-week guard; this diagnostic association
      is not equal-iTOW association and never estimates a fitted offset.
    sigma: P-12 exact 1000 ms raw-yaw endpoint pairs with full IMU support; sqrt(sample_variance(delta_yaw minus
      gyro integral)/2); Euler yaw-rate primary and frozen z-increment companion; report only, never change yaw_std.
    missing_support: UNAVAILABLE with count and reason, never zero-filled.
    float_reporting: All 378 BY2O window E epochs enter delta with fixed/float flag; float-only mean/std/P95 plus
      overlaps with both closed occlusion intervals. Explicit source-consistency count rows enumerate the float
      A1 overlap with primary, secondary, inside union and outside; retain each excluded epoch record.
    gravity_mps2: 9.801554354839126
    association: Current IMU interval (previous,current], dt<=0.1s; RP chronological linear interpolation only between
      adjacent samples with dt<=0.1s, no extrapolation; unsupported epochs UNAVAILABLE.
  D5:
    copy: Frozen v2.1 per-sequence F02/F04 runtime config.
    allowed_changed_fields:
    - gnsspath
    hard_gate: 'a: Exactly one changed line, gnsspath; every other byte identical. b: every available static effective-option
      echo field equals corresponding frozen echo exactly, except authorized gnsspath; compare before admitting
      native/evaluation. Canonical YAML field hash is only supplementary.'
    output_override: Frozen binary --output-dir and --debug-output-dir CLI options target the new scratch run; outputpath
      field remains unchanged.
    switches_to_report:
    - enable_multi_state_qm
    - enable_qa_fallback
    expected_QM: false
    expected_QA: false
    clone_method: Direct single-line text replacement only; never parse YAML and reserialize.
  D6:
    decision_rule: NONE
    reporting: Present every variant and frozen row together, all metric deltas variant minus frozen; no selection
      or replacement of v2.1 rows.
evaluation:
  std: Pass --std with unchanged STD from the same native run for both evaluators.
  v3: Same frozen v2.1 position-only NAV transform to antenna midpoint, per-sequence baseline and fixed lever; no
    STD transport.
  v2: Frozen native NAV and same-run STD.
  parameters: Exact frozen per-sequence base_time/window and evaluator settings.
  consistency_policy: canonical_v2_wgs84_full_support
  D8:
    all_native_rows_finite: true
    max_position_displacement_from_first_m: 10000.0
    max_speed_mps: 50.0
    max_height_displacement_from_first_m: 1000.0
    failure: ALGORITHM_FAILURE_DIVERGED; retain native evidence; skip both evaluator slots as NOT_RUN_ALGORITHM_FAILURE.
  D12:
    bounded_consistency_failure: UNAVAILABLE_EVALUATION_FAILED; no admitted metrics; continue without retry.
    evaluator_process_identity_or_access_failure: HARD_STOP
hard_stops:
- D3 byte or required validity gate failure
- Config fidelity a/b/c applicable gate failure; non-gnsspath bytes or effective options differ
- Binary, evaluator, frozen table or IMU/RD/RP/HV identity mismatch
- Evaluator process failure
- H-EXT-03 inherited identity or access audit failure
fail_soft: Other documented unavailable or algorithm outcomes continue without relaxing any hard gate.
execution:
  prerequisite: Definition resolved, tests and read-only review pass, commit 1 pushed and exact code_freeze receipt
    verified.
  checkpoint: Each sequence pre/post raw/provider/config/binary/evaluator/frozen-table hashes; frozen figures and
    RENDER_MANIFEST unchanged.
  storage: Write to new exclusive ext4 scratch; verify per-file archive SHA256 on G before archive completion.
  audit: strace native and evaluator processes; zero native trace opens; exactly one reference open per evaluator
    child.
  forbidden: No C++ or binary edits, HV/RP/RD byte changes, std/gate changes, parameter search, v2.1 row/28-figure/RENDER_MANIFEST
    edits, or historical result substitution.
