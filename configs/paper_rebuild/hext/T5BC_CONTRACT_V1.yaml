    no_selection: true
    heading_fault_policy: All 61 retained. Original yaw/A1 fault columns are replaced by D2; report replaced and
      retained fault components, never claim the old heading injection survives. No new vector injection.
  D2:
    source: HPPOSECEF GNSS2 minus GNSS1 at exactly common iTOW, fixed EXT05 NED frame; 5 Hz; both PVT carrSoln fixed
      only.
    conversion: Direct calls to frozen status_yaw_builder A1 conversion through unchanged T5a adapter; no alternative
      transform.
    L_m: 0.35
    R5_yaw_std_deg: 2.933193
    R5SIGMA: Constant BY2 D3 1 s sigma, converted rad to degree.
    R5W: degrees(k * sqrt(pAcc1_m^2+pAcc2_m^2) / 0.35)
    B3:
      observation: z = p2-p1 in fixed NED
      prediction: C_nb * [0,-0.35,0]_FRD
      covariance: k_b^2 * (pAcc1_m^2+pAcc2_m^2) * I3
      scalar_yaw_valid: 0
      stacking: false
      residual: h-z
      jacobian: H_phi=skew(h), existing positive-left phi stateFeedback convention
      nis_threshold_3dof: 11.34
      F02_gate: false
      slot: Existing A1 scheme-C and a1_measurement_action; semantics unchanged.
      observability: Single baseline has rank two; rotation about the baseline axis remains unobservable.
      sidecar_columns:
      - time
      - b_n
      - b_e
      - b_d
      - pAcc1
      - pAcc2
      - valid
    provider_clipping: false
    pacc_decode_m: HPPOSECEF unsigned pAcc multiplied by 1e-4
    byte_gate: Every byte outside yaw/yaw_std/yaw_valid is identical to the corresponding frozen table. B3 yaw_valid
      is zero on every row.
    time_join: V2 inverse time formula, exact raw-grid match within 1 microsecond; no nearest or interpolation;
      unmatched D57 rows valid=0.
  D3:
    trace_participates: false
    primary_sequence: BY2
    applied_sequences:
    - BY2
    - BY2H
    - BY2O
    L_m: 0.35
    lag_ms: 1000
    check_lag_ms: 200
    variance_ddof: 1
    scalar_residual: r_psi = unwrapped psi(t+1)-psi(t)-integral installed omega_z dt
    sigma_rad: sqrt(Var(r_psi)/2)
    S: pAcc1_m^2+pAcc2_m^2
    k_squared: Var(r_psi) * L^2 / mean_pairs(S_second+S_first)
    vector_residual: r = b_second - Q_n * b_first
    Q_n: C_start * Exp(sum installed body gyro increments over the actual pair interval) * C_start^T; C_start from
      starting raw yaw and frozen RP.
    k_b_squared: trace(Cov(r)) / (6 * mean_pairs(S_second+S_first))
    pairs: Exact 1 s and 0.2 s endpoints on raw 200 ms grid; both fixed across interval; frozen IMU/RP support;
      no residual trimming, wrapping, clipping or floor.
    S_bins: Three deterministic BY2 tertile bins of per-pair (S_first+S_second)/2; report boundaries/counts, sigma_bin,
      k*sqrt(S_bin), heading equivalent in degrees, k_b*sqrt(S_bin), vector residual dispersion.
    checks: BY2 0.2 s, and BY2H/BY2O 1 s/0.2 s sigma/k/k_b are report only; only BY2 1 s is applied.
    limitation: Residuals include gyro, initial raw-heading and frozen-RP mapping motion errors.
