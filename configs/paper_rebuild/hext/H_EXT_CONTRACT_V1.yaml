bookkeeping_resolutions:
- 22 raw rows receive size/metadata identity checks; 21 nontrace payloads receive pre/post SHA256. Trace SHA256
  is verified only by each evaluator child sole read handle. Bag/fpl inventory hashes are outside native audit scope.
- Required BY2 default identity recheck pair is separate prereg validation (2 native,0 evaluator), outside 14 new
  comparison rows.
- FILE_START static failure is classified before native launch; CONTRACT_START replaces its slots, so no budget
  overrun.
- Frozen BY2 v2 external rows reuse pinned CLEAN5 parity summary because no P07 v2 horizontal table exists; sources
  retained.
- To avoid circular ZIP SHA and commit2 dependency, commit2 records final receipt location; ZIP is finalized after
  commit2 and embeds both commits. Actual package SHA/bytes/CRC/member hashes are in external receipt; no self-referential
  hash claim.
- H-EXT-03 retains H02 failed evaluation v3 as historical process evidence while scientific slots for its divergent
  native are NOT_RUN_ALGORITHM_FAILURE in both versions.
- D9 manuscript starts are separate from unchanged native execution topology; no native record is rewritten.
- H03 code_freeze is commit1; final package embeds H02 and H03 authorization/result hashes. Result commit points
  to external package receipt to avoid a self-referential ZIP hash.
