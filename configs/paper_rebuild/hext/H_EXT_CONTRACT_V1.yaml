authorization: H-EXT-03 prompt 2026-09-16
human_decisions:
  D1: imu_gap_policy = DROP_DT_GT_0P1_AND_CONTINUE：适配器丢弃 dt≤0 或 dt>0.1 s 的样本，与 LegSA invalid_dt_policy 相同；滤波器不改，不填充，不膨胀协方差，下一样本按自身
    dt 传播；每个 gap 记录：起止、时长、gap 期间施加的 GNSS 更新数、跨 gap 的位置/速度/航向跳变。
  D2: 起点约定：FILE_START 为主行（方法原生，与 BY2 冻结用法一致：固定 NED 原点与初始化在首个 common GNSS1 HPPOSECEF 历元，静态校验照旧，标定窗 = IMU 文件前 5 s）。CONTRACT_START
    仅 BY2H 作诊断行：初始化在首个 ≥ t_start(413) 的 common GNSS1 历元，yaw 取其后首个有效基线，速度零，静态校验豁免并在合约中登记为偏离，标定窗不变，传播从 ≥ t_start 的首个未丢弃
    IMU 样本开始。若任一序列 FILE_START 静态校验失败，则该序列 CONTRACT_START 升为主行并标记（BY2O 此时补跑 CONTRACT_START，预算内）。
  D3: BY2O 不做特殊处理；表中标注 GNSS2 pAcc 超阈值 52 历元与 status float 57 历元；输出分段表，含合约遮挡窗口段（3369.94–3411.95 主、3495.94–3508.94
    次）。
  D4: expected 门按观测值：BY2H HPPOSECEF 1483/1483、RAWX 1483/1483、common 1483、首端额外 HP 历元 0、间隔全 200 ms、HP=RAWX+2 ms、IMU
    63222；BY2O 2231/2231、2231/2231、2231、0、全 200 ms、+2 ms、IMU 95860；两序列周 2408、闰秒 18。BY2 保持 1510/1509/1/63278。
  D5: 配置四组：LC01（文献）、EXT05C（文献，诊断）、LC01-S、EXT05C-S（共享参数，值 = parameters.py 已实现：gyro PSD 8.209651003126647e-08 rad²/s
    ×3；accel PSD = q 三轴；s=1.0308398903907543 施加于安装后的当前样本 FRD 比力）。报告规则：三序列主表文献行与 S 行都列；正文对比行取 BY2 C00 v3 航向 RMSE
    更小的一版（LC01-S BY2 对冻结 2.994827°），三序列统一使用，另一版进补充材料；结果方向无论如何如实报。
  D6: 几何审计照跑照记，不作准入门；失败行 status=AVAILABLE_GEOMETRIC_AUDIT_FAIL，指标照算。
  D7: 硬停分类：读取 EXT05C-S/BY2H/FILE_START 的全率 native NAV，报告首个越界历元、最大 |位置−首历元| 与最大 |速度|；该行 native 状态 ALGORITHM_FAILURE_DIVERGED，其
    v3/v2 科学评估槽为 NOT_RUN_ALGORITHM_FAILURE。已发生的第 17 次评估原记录 FAILED_EVALUATOR_CONSISTENCY 保留，不重试；科学槽分类不抹去历史进程调用。
  D8: 评估前有界门（仅外部行）：native NAV 全行有限；位置相对首历元的三维欧氏范数 ≤ 1e4 m；速度三维欧氏范数 ≤ 50 m/s；高度相对首历元绝对值 ≤ 1e3 m。原生 NAV.csv 的固定 NED
    米制坐标；全文件、不只评估窗。场地尺度约 300 m，阈值远离真实轨迹。不通过 → ALGORITHM_FAILURE_DIVERGED，不调评估器。14 次 native 全部执行并记录；已通过的 16 次评估回溯核对，不通过只报告不改结果。
  D9: D2 看到结果后修订：BY2H 论文对比行 = CONTRACT_START（协议起点，与提出方法相同；窗前 IMU 中断被协议起点排除）；FILE_START 保留为方法原生诊断行，同表列出。BY2、BY2O
    保持 FILE_START。amended_after_results_seen=true；附 BY2H LC01 与 LC01-S × FILE_START/CONTRACT_START × v3/v2 共 8 行
    H/yaw 数值；修订方向混合：航向略差、位置更好。旧 D2、run_matrix 的执行身份保留为历史，不改原 native。
  D10: 主配置选择结果 S：BY2 C00 v3 yaw RMSE 1.5392385536245534 deg < 2.9948274600591076 deg；三序列统一使用 S 论文行，文献 LIT 行进入补充材料，表中两版都保留。
  D11: 先确认 A10 两行 NAV 的真实来源；仅 v2.1 序列全率 NAV 如在 c541_v21_handoff.zip（SHA256 98a77b4601b897956a6d87f5bfa92e008b584add35e48e2b22a9088ddec07585）或
    20_FINALIZE 归档内，可核包/成员哈希后只读提取至 hext_scratch 诊断；否则 UNAVAILABLE。禁止 NAV_10HZ 或旧校准链替代。
  D12: 本任务起：评估器进程失败、身份不等或访问审计失败 = 硬停；一致性门失败先查 native D8：无界按 D7 分类继续，有界按 GINav 先例逐行 UNAVAILABLE_EVALUATION_FAILED、正式指标空缺并继续；均不重试。原
    capture 阈值与科学计算不变。
initialization:
  FILE_START: Frozen first common valid position after first5s calibration (all three observed first common epochs
    follow calibration); zero velocity; fixed NED origin first common GNSS1 of file.
  CONTRACT_START: First common GNSS1 at or after sequence t_start; yaw from first valid subsequent baseline; zero
    velocity; unchanged file-first5s calibration; static admission waived and recorded; NED origin stays file first
    common; no propagation before start, first retained valid IMU interval at or after start.
  fallback: Classify FILE_START static failure before launching native filters; select CONTRACT_START in its budget
    slots; BY2H preplanned CONTRACT_START reused, not duplicated.
  no_other_initial_covariance_change: true
