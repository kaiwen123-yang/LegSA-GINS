    variant: 1.0308398903907543
    placement: All three unrounded FRD force axes after FLU->FRD and installation, before integration; frozen
      literature previous-sample propagation retained
  imu_gap_policy:
    default: frozen_filter_raise
    variant: mirror_legsa_drop
    implementation: H_EXT_02_ADAPTER_ALL_CONFIGURATIONS
    decision_stage: H-EXT-02_AUTHORIZED
    A10_facts: Frozen BY2H increments 407.017058->413.041069 (6.024011 s) straddle initialization with no left
      NAV; inside-window 414.905067->415.081079 (0.176012 s) uses retained timestamp dt and NAV changes. Raw
      4.740005970001221 s gap is not a demonstrated 4.7 s NAV step.
    gap_table: sequences.*.imu_gaps
    execution_policy: DROP_DT_GT_0P1_AND_CONTINUE
    mechanism: Classify adjacent raw IMU timestamps. Skip every propagation substep within invalid source interval,
      retain GNSS updates at original times, advance clock without covariance inflation. Invalid endpoint sample
      is not assimilated. First subsequent valid interval uses its own dt and the last retained previous sample;
      thereafter frozen previous-sample hold. Nonpositive endpoints never rewind state; impossible overlapping
      chronology is a technical failure. Frozen default identity path remains frozen_filter_raise.
  unchanged:
