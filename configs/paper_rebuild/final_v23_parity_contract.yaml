    - {index: 4, name: height, unit: m, source: GNSS1_status_pos_height}
    - {index: 5, name: std_n, unit: m, source: GNSS1_status_pos_acc_h}
    - {index: 6, name: std_e, unit: m, source: GNSS1_status_pos_acc_h}
    - {index: 7, name: std_d, unit: m, source: GNSS1_status_pos_acc_v}
    - {index: 8, name: vn, unit: m_per_s, source: GNSS1_raw_NAV_PVT_velN}
    - {index: 9, name: ve, unit: m_per_s, source: GNSS1_raw_NAV_PVT_velE}
    - {index: 10, name: vd, unit: m_per_s, source: GNSS1_raw_NAV_PVT_velD}
    - {index: 11, name: std_vn, unit: m_per_s, source: fixed_0p05}
    - {index: 12, name: std_ve, unit: m_per_s, source: fixed_0p05}
    - {index: 13, name: std_vd, unit: m_per_s, source: fixed_0p05}
    - {index: 14, name: yaw, unit: deg_NED, source: status_A1_then_archived_noise_injection}
    - {index: 15, name: yaw_std, unit: deg, source: fixed_measurement_std_1p5}
  receiver_velocity_merge:
    method: nearest
    tolerance_seconds: 0.1
  dual_yaw_merge:
    method: nearest
    tolerance_seconds: 0.6
  fill_policy:
    receiver_velocity_and_trace_columns: forward_fill_then_back_fill
    status_yaw_after_merge: forward_fill_then_back_fill
  final_drop_policy: drop_row_if_any_output_column_is_missing
  outage_epoch_deletion:
    archived_same_run_enabled: false
    clean_allowed: false

