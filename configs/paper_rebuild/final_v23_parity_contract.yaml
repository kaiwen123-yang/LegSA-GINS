  status_interpolation_tolerance_seconds: none
  baseline_formula: negative_atan2_rel_e_rel_n
  body_candidate_formula: wrap(sign_times_baseline_plus_install_offset)
  sign: 1.0
  install_offset_deg: 0.0
  ned_formula: wrap(90_deg_minus_body_candidate)
  validity:
