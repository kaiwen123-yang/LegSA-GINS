  <g id="text_22">
   <text style="fill: #a32524; font: 11px 'DejaVu Sans'; text-anchor: middle" x="316.8" y="45.144" transform="rotate(-0 316.8 45.144)">ASSUMED EXAMPLE — NOT FIELD CALIBRATION</text>
  </g>
  <g id="text_23">
   <text style="font: 9px 'DejaVu Sans'" transform="translate(82.368 363.886594)">Horizontal local toy: delta(v_E) = delta(w_E) + V*delta(psi).</text>
   <text style="font: 9px 'DejaVu Sans'" transform="translate(82.368 375.582656)">Assumed sigma(w_E)=0.05 m/s and sigma(psi)=2 deg. Omitting the cross term can raise or lower the result.</text>
  </g>
